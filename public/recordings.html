<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hey There — recordings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22384B; --slate:#5D6F7E; --sun:#DFA05A;
  --display:"Instrument Serif",Georgia,serif;
  --ui:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--ui); color:var(--ink);
  background:linear-gradient(180deg,#EFF4F7 0%,#DFE8ED 100%);
  min-height:100vh; padding:32px 24px 80px;
}
.wrap{max-width:900px; margin:0 auto}
h1{font-family:var(--display); font-weight:400; font-size:34px; margin-bottom:6px}
.lead{color:rgba(34,56,75,.6); font-size:14px; margin-bottom:24px}
h2{font-family:var(--display); font-weight:400; font-size:22px; margin-top:28px; margin-bottom:10px}
a{color:var(--ink)}
.bar{display:flex; gap:10px; margin-bottom:16px}
button{
  font:inherit; cursor:pointer;
  border:1px solid rgba(34,56,75,.25);
  background:rgba(255,255,255,.6); color:var(--ink);
  border-radius:999px; padding:7px 14px; font-size:13px;
}
button:hover{background:rgba(255,255,255,.9)}
button.danger{border-color:rgba(138,58,42,.4); color:#8a3a2a}
.card{
  background:rgba(255,255,255,.6); border:1px solid rgba(34,56,75,.14);
  border-radius:14px; padding:16px 18px; margin-bottom:12px;
}
.rec-hdr{display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap}
.rec-title{font-family:var(--mono); font-size:12.5px}
.rec-meta{font-family:var(--mono); font-size:11.5px; color:rgba(34,56,75,.55)}
audio{width:100%; margin-top:10px}
.numbers{display:grid; grid-template-columns:repeat(2,1fr); gap:6px 24px; font-size:13px; margin-top:10px}
.k{color:rgba(34,56,75,.55)}
.v{font-family:var(--mono); text-align:right}
.transcript{font-size:13px; margin-top:10px; padding:8px 10px; background:rgba(34,56,75,.05); border-radius:8px; color:rgba(34,56,75,.75); line-height:1.5}
.events{
  margin-top:10px; padding:10px 12px;
  background:rgba(255,255,255,.6); border:1px solid rgba(34,56,75,.14);
  border-radius:8px; max-height:280px; overflow-y:auto;
  font-family:var(--mono); font-size:11px; line-height:1.45; color:rgba(34,56,75,.8);
}
.ev-line{padding:1px 0; white-space:pre-wrap; word-break:break-word}
.ev-line.out{color:#3a5f8a}
.ev-line.err{color:#8a3a2a}
.ev-line.meta{color:rgba(34,56,75,.5)}
.baseline-turns{margin-top:8px; overflow-x:auto}
.baseline-turns table{width:100%; min-width:480px; border-collapse:collapse; font-family:var(--mono); font-size:12.5px}
.baseline-turns th,.baseline-turns td{padding:5px 8px; text-align:right; border-bottom:1px solid rgba(34,56,75,.1)}
.baseline-turns th:first-child,.baseline-turns td:first-child{text-align:left}
.baseline-turns th{color:rgba(34,56,75,.55); font-weight:500}
.empty{color:rgba(34,56,75,.5); font-size:14px; padding:14px 0}
.rec-actions{display:flex; gap:8px; margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <a href="/">← back to app</a>
  <h1>Recordings</h1>
  <p class="lead">Recordings and baseline live in IndexedDB on this browser. Nothing is uploaded except when you tap re-analyze.</p>

  <div class="bar">
    <button id="refresh">Refresh</button>
    <button id="resetBase" class="danger">Reset baseline</button>
    <button id="clearAll"  class="danger">Delete all recordings</button>
  </div>

  <h2>Baseline (last 12 turns)</h2>
  <div class="card" id="baselineCard"></div>

  <h2>Recordings</h2>
  <div id="list"></div>
</div>

<script type="module">
import {
  listRecordings, getRecording, deleteRecording,
  getBaseline, resetBaseline,
  featuresFromWhisper, computeZ, energy, mismatchFlag,
} from './lib/store.js';

const accessCode = localStorage.getItem('heythere_code') || '';
const authHeaders = () => accessCode ? { 'x-access-code': accessCode } : {};

const list = document.getElementById('list');
const baselineCard = document.getElementById('baselineCard');
const $ = (id) => document.getElementById(id);

function fmtDate(ms) {
  const d = new Date(ms);
  return d.toLocaleString();
}
function fmtDur(sec) {
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function fmtNum(n, d = 2) { return Number.isFinite(n) ? n.toFixed(d) : '—'; }

async function renderBaseline() {
  const b = await getBaseline();
  if (!b.turns.length) {
    baselineCard.innerHTML = '<div class="empty">No baseline turns yet. Talk to the app first.</div>';
    return;
  }
  const rows = b.turns.map(t => `
    <tr>
      <td>${new Date(t.at).toLocaleString()}</td>
      <td>${fmtNum(t.rate*60,0)}</td>
      <td>${fmtNum(t.pauseRatio*100,0)}%</td>
      <td>${fmtNum(t.pitchSpread,1)}</td>
      <td>${t.valence === null || t.valence === undefined ? '—' : (t.valence>=0?'+':'')+t.valence.toFixed(2)}</td>
      <td>${t.wordCount ?? '—'}</td>
    </tr>
  `).join('');
  baselineCard.innerHTML = `
    <div class="baseline-turns">
      <table>
        <thead><tr>
          <th>when</th><th>wpm</th><th>pause</th><th>pitch st</th><th>valence</th><th>words</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function renderRecordings() {
  const recs = await listRecordings();
  if (!recs.length) {
    list.innerHTML = '<div class="empty">No recordings yet. Complete a call from the app first.</div>';
    return;
  }
  list.innerHTML = '';
  for (const r of recs) {
    const url = URL.createObjectURL(r.blob);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="rec-hdr">
        <div class="rec-title">${r.id}</div>
        <div class="rec-meta">${fmtDate(r.at)} · ${fmtDur(r.durationSec)} · ${r.mime || 'audio/webm'} · ${Math.round(r.blob.size/1024)} KB</div>
      </div>
      <audio controls src="${url}"></audio>
      <div class="numbers" id="nums-${r.id}"></div>
      <div class="transcript" id="tx-${r.id}" style="display:none"></div>
      <div class="events" id="ev-${r.id}" style="display:none"></div>
      <div class="rec-actions">
        <button data-id="${r.id}" class="analyze">Re-analyze</button>
        <button data-id="${r.id}" class="events-btn">Show events (${r.events?.length ?? 0})</button>
        <button data-id="${r.id}" class="download">Download</button>
        <button data-id="${r.id}" class="del danger">Delete</button>
      </div>
    `;
    list.appendChild(card);
  }
  list.querySelectorAll('button.events-btn').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.id;
    const box = $(`ev-${id}`);
    if (box.style.display === 'block') { box.style.display = 'none'; return; }
    const r = await getRecording(id);
    const events = r.events || [];
    if (!events.length) { box.innerHTML = '<div class="ev-line meta">(no events captured)</div>'; }
    else {
      box.innerHTML = events.map(e => {
        const stamp = ('   ' + e.rel.toFixed(2)).slice(-6) + 's';
        const short = e.data ? '  ' + (typeof e.data === 'string' ? e.data : JSON.stringify(e.data)).slice(0, 260) : '';
        return `<div class="ev-line ${e.kind}">${stamp}  ${e.kind.padEnd(4)}  ${e.type}${short}</div>`;
      }).join('');
    }
    box.style.display = 'block';
  }));
  list.querySelectorAll('button.del').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete this recording?')) return;
    await deleteRecording(b.dataset.id);
    renderRecordings();
  }));
  list.querySelectorAll('button.download').forEach(b => b.addEventListener('click', async () => {
    const r = await getRecording(b.dataset.id);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(r.blob);
    a.download = r.id + '.' + (r.mime?.includes('mp4') ? 'm4a' : 'webm');
    a.click();
  }));
  list.querySelectorAll('button.analyze').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.id;
    const r = await getRecording(id);
    b.disabled = true; b.textContent = 'analyzing…';
    try {
      // /transcribe
      const wRes = await fetch('/transcribe', {
        method: 'POST',
        headers: { ...authHeaders(), 'Content-Type': r.mime || 'audio/webm' },
        body: r.blob,
      });
      if (!wRes.ok) throw new Error('transcribe ' + wRes.status);
      const whisper = await wRes.json();
      const feats = featuresFromWhisper(whisper);
      // /valence
      let valence = null;
      if (whisper.text?.trim()) {
        const vRes = await fetch('/valence', {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcript: whisper.text }),
        });
        if (vRes.ok) valence = (await vRes.json()).valence;
      }
      const base = await getBaseline();
      const z = computeZ({ rate: feats.rate, pauseRatio: feats.pauseRatio, pitchSpread: 0 }, base);
      const eZ = z.ready ? energy(z.z) : null;
      const mm = (eZ !== null && valence !== null) ? mismatchFlag(eZ, valence) : false;
      const nums = $(`nums-${id}`);
      nums.innerHTML = `
        <span class="k">Words</span><span class="v">${feats.wordCount}</span>
        <span class="k">Voiced sec</span><span class="v">${fmtNum(feats.voicedSec,1)}</span>
        <span class="k">Rate (wpm)</span><span class="v">${fmtNum(feats.rate*60,0)}${z.ready?' · '+(z.z.rate>=0?'+':'')+z.z.rate.toFixed(1)+'σ':''}</span>
        <span class="k">Pause ratio</span><span class="v">${fmtNum(feats.pauseRatio*100,0)}%${z.ready?' · '+(z.z.pauseRatio>=0?'+':'')+z.z.pauseRatio.toFixed(1)+'σ':''}</span>
        <span class="k">Long pauses / min</span><span class="v">${fmtNum(feats.spanSec>0 ? feats.longPauses/(feats.spanSec/60) : 0, 1)}</span>
        <span class="k">Valence</span><span class="v">${valence === null ? '—' : (valence>=0?'+':'')+valence.toFixed(2)}</span>
        ${eZ!==null ? `<span class="k">Energy (voice)</span><span class="v">${eZ.toFixed(2)}σ</span>` : ''}
        ${mm ? `<span class="k" style="color:#8a3a2a">Mismatch</span><span class="v" style="color:#8a3a2a">yes</span>` : ''}
      `;
      const tx = $(`tx-${id}`);
      tx.style.display = 'block';
      tx.textContent = whisper.text || '(no transcript)';
    } catch (e) {
      alert('analyze failed: ' + e.message);
    } finally {
      b.disabled = false; b.textContent = 'Re-analyze';
    }
  }));
}

$('refresh').addEventListener('click', () => { renderRecordings(); renderBaseline(); });
$('resetBase').addEventListener('click', async () => {
  if (!confirm('Reset baseline turns?')) return;
  await resetBaseline();
  renderBaseline();
});
$('clearAll').addEventListener('click', async () => {
  if (!confirm('Delete ALL recordings? This cannot be undone.')) return;
  const recs = await listRecordings();
  for (const r of recs) await deleteRecording(r.id);
  renderRecordings();
});

renderRecordings();
renderBaseline();
</script>
</body>
</html>
