<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hey There</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e8eef4;
      --muted: #8b9aab;
      --accent: #5ec8ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 20% 20%, #1a2a3a 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #1a2830 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
      padding: 2rem;
    }
    main { max-width: 32rem; text-align: center; }
    h1 {
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }
    p { color: var(--muted); line-height: 1.55; margin-bottom: 1.25rem; }
    a { color: var(--accent); }
    code {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.4rem 0.7rem;
      background: #1a222c;
      border-radius: 6px;
      color: var(--fg);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>hey there</h1>
    <p>
      Voice-first check-in app. The live app needs a Node server (API keys stay
      on the backend) — clone the repo and run locally.
    </p>
    <p>
      <a href="https://github.com/qingcisong/hey_there">github.com/qingcisong/hey_there</a><br />
      <code>cp env.template .env && npm start</code>
    </p>
    <p>
      <a href="docs/hey-there-deck.html">Pitch deck</a>
      ·
      <a href="docs/HANDOFF.md">Design handoff</a>
    </p>
  </main>
</body>
</html>
