<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hey_there</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e8eef4;
      --accent: #5ec8ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 20% 20%, #1a2a3a 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #1a2830 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }
    p {
      color: color-mix(in srgb, var(--fg) 65%, transparent);
      font-size: 1.1rem;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>hey there</h1>
    <p>Temporary placeholder page for GitHub Pages.</p>
    <span class="badge">qingcisong / hey_there</span>
  </main>
</body>
</html>
